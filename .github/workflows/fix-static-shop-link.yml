name: Fix static storefront link

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-static-shop-link.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace stale Printify fallback URL
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/public/index.html')
          text = path.read_text(encoding='utf-8')
          old = 'https://stormandme.printify.me'
          new = 'https://storm-and-me-official.printify.me'
          count = text.count(old)
          if count == 0:
              print('No stale fallback storefront URLs remain.')
          else:
              text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
              print(f'Replaced {count} stale storefront URL(s).')
          assert old not in path.read_text(encoding='utf-8')
          assert path.read_text(encoding='utf-8').count(new) >= 2
          print('Static fallback storefront contract PASS.')
          PY
      - name: Commit correction
        run: |
          git config user.name "stormandme-bot"
          git config user.email "stormandme-bot@users.noreply.github.com"
          git add frontend/public/index.html
          if git diff --cached --quiet; then
            echo "Fallback URL already current."
          else
            git commit -m "fix: align static merch storefront link"
            git push origin HEAD:main
          fi
