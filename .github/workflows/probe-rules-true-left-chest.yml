name: Probe Rules true left chest

on:
  push:
    branches:
      - fix/rules-true-left-chest
    paths:
      - 'automation/printify/probe_rules_true_left_chest.py'
      - '.github/workflows/probe-rules-true-left-chest.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
      PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Capture classic left-chest candidates
        run: python automation/printify/probe_rules_true_left_chest.py
      - name: Upload placement QA
        uses: actions/upload-artifact@v4
        with:
          name: rules-true-left-chest-probe
          path: automation-output/rules-true-left-chest-probe
          if-no-files-found: error
          retention-days: 7
