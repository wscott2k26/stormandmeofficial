name: Probe Rules approved layout

on:
  push:
    branches:
      - fix/rules-approved-streetwear-layout
    paths:
      - 'automation/printify/finalize_rules_collection_layout.py'
      - '.github/workflows/probe-rules-approved-layout.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
      PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
      RULES_LAYOUT_MODE: probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Create unpublished placement canaries and capture mockups
        run: python automation/printify/finalize_rules_collection_layout.py
      - name: Upload placement QA mockups
        uses: actions/upload-artifact@v4
        with:
          name: rules-approved-layout-probe
          path: automation-output/rules-approved-layout
          if-no-files-found: error
          retention-days: 7
