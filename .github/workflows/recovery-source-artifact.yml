name: Recovery Source Artifact
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          tar --exclude=.git -czf stormandme-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: stormandme-source
          path: stormandme-source.tgz
          retention-days: 1
