name: Publish Rules collection

on:
  push:
    branches:
      - feature/rules-live-products
    paths:
      - 'automation/printify/publish_rules_collection.py'
      - '.github/workflows/publish-rules-collection.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
      PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rules-live-products
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow
      - name: Publish exact approved products
        run: python automation/printify/publish_rules_collection.py
      - name: Verify generated site data
        run: |
          test -s frontend/src/data/rules-products.generated.json
          python - <<'PY'
          import json
          data=json.load(open('frontend/src/data/rules-products.generated.json'))
          assert len(data['products']) == 3
          expected={'rules-black-tee':3200,'rules-hoodie':6200,'rules-white-tee':2800}
          for p in data['products']:
              assert p['price_cents'] == expected[p['id']]
              assert p['image'].startswith('https://')
              assert p['url'].startswith('https://')
          print('Generated 3 live product records with real HTTPS mockups and links.')
          PY
      - name: Commit generated Printify data
        run: |
          if git diff --quiet -- frontend/src/data/rules-products.generated.json; then
            echo 'Generated product data unchanged.'
            exit 0
          fi
          git config user.name 'stormandme-product-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/data/rules-products.generated.json
          git commit -m 'data: sync live Rules Printify products'
          git push origin HEAD:feature/rules-live-products
      - name: Upload publisher report
        uses: actions/upload-artifact@v4
        with:
          name: rules-collection-publish-report
          path: automation-output/rules-collection-results.json
          if-no-files-found: error
          retention-days: 14
