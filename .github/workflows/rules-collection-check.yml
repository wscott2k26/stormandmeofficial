name: Rules collection check

on:
  pull_request:
    paths:
      - 'frontend/src/components/FeaturedMerchPortal.js'
      - 'frontend/scripts/validate-rules-collection.cjs'
      - '.github/workflows/rules-collection-check.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Rules Don't Exist collection contract
        run: node frontend/scripts/validate-rules-collection.cjs
