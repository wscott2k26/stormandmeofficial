name: Debug Rules catalog

on:
  pull_request:
    branches: [main]
    paths:
      - 'automation/printify/debug_rules_catalog.py'
      - '.github/workflows/debug-rules-catalog.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python automation/printify/debug_rules_catalog.py
