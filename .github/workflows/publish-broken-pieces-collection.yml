name: Publish Broken Pieces collection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-broken-pieces-collection.yml"
      - "automation/printify/publish_broken_pieces_collection.py"
      - "automation/printify/broken_pieces_core.py"
      - "automation/printify/broken_pieces_premium_art.py"
      - "tests/broken_pieces_merch_contract_test.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: broken-pieces-collection-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
      PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Gate 1 — syntax and five-design artwork contract
        run: |
          python -m py_compile automation/printify/publish_broken_pieces_collection.py automation/printify/broken_pieces_core.py automation/printify/broken_pieces_premium_art.py
          python - <<'PY'
          import importlib.util
          path='automation/printify/publish_broken_pieces_collection.py'
          spec=importlib.util.spec_from_file_location('bp', path)
          bp=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(bp)
          assert len(bp.PRODUCTS) == 5
          assert [p['slug'] for p in bp.PRODUCTS] == ['cracked-heart','kintsugi-heart','broken-cross','streetwear','puzzle-piece']
          for product in bp.PRODUCTS:
              front, back = bp.build_art(product)
              assert front.size == (4500, 5400)
              assert back.size == (4500, 5400)
              assert front.mode == 'RGBA'
              assert back.mode == 'RGBA'
              assert front.getbbox() is not None
              assert back.getbbox() is not None
          print('Gate 1 PASS: five front/back transparent print assets generate cleanly.')
          PY

      - name: Gate 2 — publish five Broken Pieces products and remove accidental reference drop
        run: python automation/printify/publish_broken_pieces_collection.py

      - name: Gate 3 — full merch contract
        run: python -m unittest tests/broken_pieces_merch_contract_test.py -v

      - name: Gate 4 — verify generated live product data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('frontend/src/data/broken-pieces-products.generated.json').read_text())
          assert data['collection'] == 'BROKEN PIECES COLLECTION'
          assert str(data['shop_id']) == '28312107'
          assert len(data['products']) == 5
          for p in data['products']:
              assert p['visible'] is True
              assert p['printify_product_id']
              assert p['image'].startswith('https://images-api.printify.com/mockup/')
              assert p['url'].startswith('https://storm-and-me-official.printify.me/product/')
              assert p['price_cents'] > 0
          portal=Path('frontend/src/components/FeaturedMerchPortal.js').read_text()
          assert 'broken-pieces-products.generated.json' in portal
          assert 'obama-reference-products.generated.json' not in portal
          assert portal.index('BROKEN PIECES COLLECTION') < portal.index('RULES DON’T EXIST ANYMORE')
          print('Gate 4 PASS: five live products are wired first on the site; Rules remains below.')
          PY

      - name: Commit generated live product data and site feature
        run: |
          git config user.name "stormandme-bot"
          git config user.email "stormandme-bot@users.noreply.github.com"
          git add frontend/src/data/broken-pieces-products.generated.json frontend/src/components/FeaturedMerchPortal.js
          if git diff --cached --quiet; then
            echo "Generated storefront files already current."
          else
            git commit -m "feat: feature live Broken Pieces collection"
            git push origin HEAD:main
          fi

      - name: Upload quadruple-check report
        uses: actions/upload-artifact@v4
        with:
          name: broken-pieces-publish-report
          path: |
            automation-output/broken-pieces-publish-results.json
            automation-output/broken-pieces-art
          if-no-files-found: error
          retention-days: 14
