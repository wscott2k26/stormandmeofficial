name: Probe Rules hoodie back

on:
  pull_request:
    branches:
      - main
    paths:
      - 'automation/printify/probe_rules_hoodie_back.py'
      - 'automation/printify/finalize_rules_collection_layout.py'
      - '.github/workflows/probe-rules-hoodie-back.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
      PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Capture hoodie back placement candidates
        run: python automation/printify/probe_rules_hoodie_back.py
      - name: Upload hoodie-back QA mockups
        uses: actions/upload-artifact@v4
        with:
          name: rules-hoodie-back-probe
          path: automation-output/rules-hoodie-back-probe
          if-no-files-found: error
          retention-days: 7
