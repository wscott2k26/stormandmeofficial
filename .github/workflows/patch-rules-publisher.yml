name: Patch Rules publisher storefront placement

on:
  push:
    branches:
      - fix/rules-storefront-hero
    paths:
      - '.github/workflows/patch-rules-publisher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rules-storefront-hero
          fetch-depth: 0
      - name: Apply visually verified front placement
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('automation/printify/publish_rules_collection_v2.py')
          text = path.read_text(encoding='utf-8')
          old = '{"id": chest_logo_id, "x": 0.33, "y": 0.28, "scale": 0.22, "angle": 0}'
          new = '{"id": chest_logo_id, "x": 0.5, "y": 0.38, "scale": 3.0, "angle": 0}'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one old placement, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          print('Patched publisher front placement to x=.5 y=.38 scale=3.0')
          PY
          git config user.name 'stormandme-product-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add automation/printify/publish_rules_collection_v2.py
          git commit -m 'fix: keep Rules storefront fronts visibly branded'
          git push origin HEAD:fix/rules-storefront-hero
