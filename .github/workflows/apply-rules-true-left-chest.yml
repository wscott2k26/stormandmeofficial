name: Apply Rules true left chest

on:
  pull_request:
    branches:
      - main
    paths:
      - 'automation/printify/apply_rules_approved_layout.py'
      - '.github/workflows/apply-rules-true-left-chest.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
      PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Apply true left-chest placement and capture live mockups
        run: python automation/printify/apply_rules_approved_layout.py
      - name: Upload live QA
        uses: actions/upload-artifact@v4
        with:
          name: rules-true-left-chest-live
          path: automation-output/rules-approved-live
          if-no-files-found: error
          retention-days: 7
