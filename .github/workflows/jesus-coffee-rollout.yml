name: Jesus & Coffee rollout

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jesus-coffee-rollout.yml"
      - "automation/printify/jesus_coffee_rollout.py"
      - "tests/test_jesus_coffee_rollout.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jesus-coffee-rollout
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
      PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
      ROLLOUT_MODE: inspect

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gate 1 — source and safety contracts
        run: |
          python -m py_compile automation/printify/jesus_coffee_rollout.py
          python -m unittest tests/test_jesus_coffee_rollout.py -v

      - name: Gate 2 — verify Printify token is configured
        shell: bash
        run: |
          test -n "$PRINTIFY_API_TOKEN" || {
            echo "Missing repository secret: PRINTIFY_API_TOKEN"
            exit 1
          }

      - name: Gate 3 — read-only Jesus & Coffee source inspection
        run: python automation/printify/jesus_coffee_rollout.py

      - name: Gate 4 — inspection report contract and compact summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('automation-output/jesus-coffee-source-inspection.json')
          data=json.loads(p.read_text())
          assert data['mode'] == 'read-only'
          assert data['safety'].startswith('No products created')
          assert isinstance(data['recent_candidates'], list)
          def compact(row):
              return {
                  'id': row.get('id'),
                  'title': row.get('title'),
                  'description': row.get('description'),
                  'keyword_score': row.get('keyword_score'),
                  'updated_at': row.get('updated_at'),
                  'visible': row.get('visible'),
                  'blueprint_id': row.get('blueprint_id'),
                  'print_provider_id': row.get('print_provider_id'),
                  'artwork_ids': [u.get('id') for u in row.get('uploads', []) if u.get('id')],
                  'artwork_files': [u.get('file_name') for u in row.get('uploads', []) if u.get('file_name')],
                  'artwork_previews': [u.get('preview_url') for u in row.get('uploads', []) if u.get('preview_url')],
                  'mockups': [m.get('src') for m in row.get('mockups', []) if m.get('src')][:3],
              }
          summary={
              'shop_id': data['shop_id'],
              'total_products': data['total_products'],
              'keyword_candidates': [compact(row) for row in data['keyword_candidates']],
              'recent_candidates': [compact(row) for row in data['recent_candidates']],
          }
          Path('automation-output/jesus-coffee-source-summary.json').write_text(json.dumps(summary, indent=2))
          print('Inspection PASS:', len(data['keyword_candidates']), 'keyword candidates;', len(data['recent_candidates']), 'recent candidates')
          PY

      - name: Persist inspection for review
        shell: bash
        run: |
          git config user.name "stormandme-bot"
          git config user.email "stormandme-bot@users.noreply.github.com"
          git add automation-output/jesus-coffee-source-inspection.json automation-output/jesus-coffee-source-summary.json
          if git diff --cached --quiet; then
            echo "Inspection report already current."
          else
            git commit -m "chore: record Jesus Coffee source inspection"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: jesus-coffee-source-inspection
          path: |
            automation-output/jesus-coffee-source-inspection.json
            automation-output/jesus-coffee-source-summary.json
          if-no-files-found: error
          retention-days: 14
