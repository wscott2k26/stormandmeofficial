name: Jesus & Coffee rollout

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jesus-coffee-rollout.yml"
      - "automation/printify/jesus_coffee_rollout.py"
      - "automation/printify/apply_jesus_coffee_collection.py"
      - "tests/test_jesus_coffee_rollout.py"
      - "tests/test_apply_jesus_coffee_collection.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jesus-coffee-rollout
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
      PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gate 1 — code and safety tests
        run: |
          python -m py_compile automation/printify/jesus_coffee_rollout.py automation/printify/apply_jesus_coffee_collection.py
          python -m unittest tests/test_jesus_coffee_rollout.py tests/test_apply_jesus_coffee_collection.py -v

      - name: Gate 2 — verify Printify connection secret
        shell: bash
        run: |
          test -n "$PRINTIFY_API_TOKEN" || {
            echo "Missing repository secret: PRINTIFY_API_TOKEN"
            exit 1
          }

      - name: Gate 3 — exact-source contract
        run: |
          PYTHONPATH=automation/printify python - <<'PY'
          import apply_jesus_coffee_collection as app
          assert len(app.SOURCES) == 5, app.SOURCES
          assert len({spec['back'] for spec in app.SOURCES.values()}) == 5
          assert len({spec['front'] for spec in app.SOURCES.values()}) == 1
          banned = {'6a87698f2721da308b42721e', '6a87698ce4442f828bd56ed4'}
          approved = {value for spec in app.SOURCES.values() for value in (spec['front'], spec['back'])}
          assert not (approved & banned), approved & banned
          print('Gate 3 PASS: five exact Coffee designs locked; legacy Broken Pieces image IDs excluded.')
          PY

      - name: Gate 4 — preflight, create, publish, and verify collection
        shell: bash
        run: |
          mkdir -p automation-output
          set +e
          PYTHONPATH=automation/printify python automation/printify/apply_jesus_coffee_collection.py > automation-output/jesus-coffee-run.log 2>&1
          status=$?
          set -e
          cat automation-output/jesus-coffee-run.log
          echo "$status" > automation-output/jesus-coffee-run.status

      - name: Gate 5 — final rollout and homepage contract
        shell: bash
        run: |
          status="$(cat automation-output/jesus-coffee-run.status)"
          if [ "$status" != "0" ]; then
            echo "Rollout command failed with status $status; preserving diagnostics before failing the job."
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('automation-output/jesus-coffee-rollout.json').read_text())
          assert report['mode'] == 'apply-approved-art-only'
          assert report['no_generated_art'] is True
          assert report['source_count'] == 5
          assert len(report['results']) >= 20, len(report['results'])
          assert report['verification'] and all(row['verified'] for row in report['verification'])
          families=set(report['phone_device_families'])
          assert families - {'iPhone'}, families
          home=Path('frontend/src/pages/Home.js').read_text()
          assert 'data-testid="jesus-coffee-featured-section"' in home
          assert 'Jesus &amp; Coffee Collection' in home
          assert 'Faith for the soul. Coffee for the morning.' in home
          feature=home.split('data-testid="jesus-coffee-featured-section"',1)[1].split('data-testid="home-merch-section"',1)[0]
          assert '<img' not in feature
          print('Gate 5 PASS:', len(report['verification']), 'verified products; phone families:', sorted(families))
          PY

      - name: Persist verified result or diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name "stormandme-bot"
          git config user.email "stormandme-bot@users.noreply.github.com"
          git add automation-output/jesus-coffee-run.log automation-output/jesus-coffee-run.status
          if [ -f automation-output/jesus-coffee-rollout.json ]; then
            git add automation-output/jesus-coffee-rollout.json
          fi
          if git diff -- frontend/src/pages/Home.js | grep -q .; then
            git add frontend/src/pages/Home.js
          fi
          if git diff --cached --quiet; then
            echo "No rollout/diagnostic changes to persist."
          else
            status="$(cat automation-output/jesus-coffee-run.status 2>/dev/null || echo unknown)"
            if [ "$status" = "0" ]; then msg="feat: launch Jesus Coffee collection"; else msg="chore: record Jesus Coffee rollout diagnostics"; fi
            git commit -m "$msg"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Final status
        if: always()
        shell: bash
        run: |
          status="$(cat automation-output/jesus-coffee-run.status 2>/dev/null || echo 1)"
          test "$status" = "0"

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jesus-coffee-rollout-verification
          path: |
            automation-output/jesus-coffee-rollout.json
            automation-output/jesus-coffee-run.log
            automation-output/jesus-coffee-run.status
          if-no-files-found: warn
          retention-days: 14
