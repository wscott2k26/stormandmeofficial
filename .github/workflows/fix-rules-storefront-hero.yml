name: Fix Rules storefront hero

on:
  push:
    branches:
      - fix/rules-storefront-hero
    paths:
      - 'automation/printify/fix_rules_storefront_hero.py'
      - '.github/workflows/fix-rules-storefront-hero.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
      PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rules-storefront-hero
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix storefront collection-card hero images
        run: python automation/printify/fix_rules_storefront_hero.py
