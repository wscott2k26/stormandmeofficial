name: Fix Rules storefront hero

on:
  push:
    branches:
      - fix/rules-storefront-hero
    paths:
      - 'automation/printify/fix_rules_storefront_hero.py'
      - 'automation/printify/probe_rules_front_scale.py'
      - '.github/workflows/fix-rules-storefront-hero.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'automation/printify/fix_rules_storefront_hero.py'
      - 'automation/printify/probe_rules_front_scale.py'
      - '.github/workflows/fix-rules-storefront-hero.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
      PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rules-storefront-hero
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply visually verified storefront front treatment
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('automation/printify/fix_rules_storefront_hero.py')
          spec = importlib.util.spec_from_file_location('rules_storefront_fix', path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          mod.TARGET_FRONT_SCALE = 3.0
          mod.TARGET_FRONT_X = 0.50
          mod.TARGET_FRONT_Y = 0.38
          mod.main()
          PY
      - name: Probe larger front-logo sizes on unpublished canaries
        run: python automation/printify/probe_rules_front_scale.py
      - name: Upload storefront hero QA mockups
        uses: actions/upload-artifact@v4
        with:
          name: rules-storefront-hero-qa
          path: |
            automation-output/storefront-hero-mockups
            automation-output/front-scale-probe
          if-no-files-found: error
          retention-days: 7
