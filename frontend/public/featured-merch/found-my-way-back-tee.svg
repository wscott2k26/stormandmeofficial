<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">I Survived the Storm — Found My Way Back Tee</title>
  <desc id="desc">Dark featured T-shirt mockup with storm clouds, a path, and a found my way back message.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="75%"><stop offset="0" stop-color="#eef1e8"/><stop offset="1" stop-color="#cfd5c7"/></radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26322d"/><stop offset="0.55" stop-color="#101713"/><stop offset="1" stop-color="#303a34"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="35" stdDeviation="28" flood-color="#11131a" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <ellipse cx="600" cy="1040" rx="380" ry="58" fill="#1c2028" opacity=".18"/>
  <path filter="url(#shadow)" d="M394 206c52 45 121 68 206 68s154-23 206-68l213 96 115 196-151 97-80-91v420H297V504l-80 91-151-97 115-196 213-96Z" fill="url(#shirt)" stroke="#46534c" stroke-width="8"/>
