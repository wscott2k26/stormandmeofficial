    <text x="600" y="752" font-size="37" font-weight="700" letter-spacing="7" fill="#d7b461">BUT YOU ARE</text>
    <text x="600" y="840" font-size="83" font-weight="900" letter-spacing="12" fill="#f2ece3">STAY</text>
